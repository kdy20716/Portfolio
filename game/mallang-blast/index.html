<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mallang Blast</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }

      /* ── Desktop: 16:9 full-viewport fill, centered ── */
      #unity-container.unity-desktop {
        position: fixed !important;
        inset: 0 !important;
        transform: none !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: #000 !important;
        overflow: hidden !important;
      }
      #unity-container.unity-desktop #unity-canvas {
        display: block !important;
        background: #110e1f;
        width: 100vw !important;
        height: 56.25vw !important;   /* 16:9 */
        max-height: 100vh !important;
        max-width: 177.78vh !important;
      }

      /* ── Mobile / iframe: fill container 100% edge-to-edge ── */
      #unity-container.unity-mobile {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        display: block !important;
        background: #000 !important;
        overflow: hidden !important;
      }
      #unity-container.unity-mobile #unity-canvas,
      canvas.unity-mobile {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        background: #110e1f;
      }

      #unity-footer { display: none !important; }

      /* ── Back button: circle icon, desktop standalone only ── */
      #back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 9999;
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #ffffff;
        text-decoration: none;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      }
      #back-btn:hover {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8);
      }
      /* Hide on touch/mobile/iframe */
      @media (pointer: coarse), (max-width: 768px) {
        #back-btn { display: none !important; }
      }

      /* ── Sound hint (desktop only, hidden in iframe/mobile) ── */
      #sound-hint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: rgba(0, 0, 0, 0.72);
        color: rgba(255,255,255,0.9);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 99px;
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(8px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        white-space: nowrap;
      }
      #sound-hint.show { opacity: 1; }

      /* ── Mobile tap-to-start overlay (required by iOS for AudioContext) ── */
      #tap-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 40px;
        pointer-events: none;
      }
      #tap-overlay.show { display: flex; }
      #tap-pulse {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 700;
        color: rgba(255,255,255,0.85);
        background: rgba(0,0,0,0.6);
        padding: 9px 20px;
        border-radius: 99px;
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(8px);
        animation: tapPulse 1.8s ease-in-out infinite;
      }
      @keyframes tapPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.97); }
      }
    </style>
  </head>
  <body>

    <!-- Back button (desktop standalone only) -->
    <a href="../../index.html#portfolio" id="back-btn"
       onclick="if(window.history.length > 1){window.history.back(); return false;}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>

    <!-- Desktop sound hint -->
    <div id="sound-hint">🔊 화면을 클릭하면 사운드가 켜집니다</div>

    <!-- Mobile tap hint (non-blocking, just bottom text) -->
    <div id="tap-overlay">
      <div id="tap-pulse">🔊 화면을 탭하면 사운드가 켜집니다</div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Mallang Blast</div>
      </div>
    </div>

    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var isIframe = window.self !== window.top;

      // iframe gets same layout as mobile (fills container 100%)
      var useMobileLayout = isMobile || isIframe;

      var container = document.getElementById('unity-container');
      var canvas    = document.getElementById('unity-canvas');
      var soundHint = document.getElementById('sound-hint');
      var tapOverlay = document.getElementById('tap-overlay');
      var backBtn   = document.getElementById('back-btn');

      // Hide back button in iframe
      if (isIframe) {
        backBtn.style.display = 'none';
        soundHint.style.display = 'none';
        tapOverlay.style.display = 'none';
      }

      // Apply layout class
      if (useMobileLayout) {
        container.className = 'unity-mobile';
        canvas.className = 'unity-mobile';
        // Viewport meta for real mobile
        if (isMobile) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.head.appendChild(meta);
        }
      }

      // ── Audio unlock ──────────────────────────────────────────────────
      var audioUnlocked = false;

      // Resume Unity's own AudioContext (the only way to fix Unity WebGL audio)
      function resumeUnityAudioContext() {
        try {
          if (window.unityInstance) {
            var mod = window.unityInstance.Module;
            // Unity 2022 LTS path
            if (mod && mod.AL && mod.AL.currentCtx && mod.AL.currentCtx.ctx) {
              var ctx = mod.AL.currentCtx.ctx;
              if (ctx.state === 'suspended') {
                ctx.resume().then(function() {
                  audioUnlocked = true;
                  hideAudioUI();
                });
                return;
              } else if (ctx.state === 'running') {
                audioUnlocked = true;
                hideAudioUI();
              }
            }
          }
        } catch(e) {}
      }

      function hideAudioUI() {
        // Hide sound hint
        soundHint.classList.remove('show');
        setTimeout(function() { soundHint.style.display = 'none'; }, 500);
        // Hide tap overlay
        tapOverlay.classList.remove('show');
        tapOverlay.style.pointerEvents = 'none';
      }

      // Try to unlock on desktop (may succeed if navigated from same site)
      function tryDesktopAutoUnlock() {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          var ctx = new AC();
          if (ctx.state === 'running') {
            // Browser allows autoplay — great, Unity will start with audio
            audioUnlocked = true;
            ctx.close();
            return;
          }
          ctx.resume().then(function() {
            audioUnlocked = (ctx.state === 'running');
            ctx.close();
          }).catch(function() {});
          ctx.close();
        } catch(e) {}
        // If not unlocked after 800ms, show the hint
        setTimeout(function() {
          if (!audioUnlocked) soundHint.classList.add('show');
        }, 800);
      }

      // User gesture handler — called on click/touch/key
      function onUserGesture() {
        if (audioUnlocked) {
          cleanup();
          return;
        }
        // Resume Unity's context
        resumeUnityAudioContext();
        // Also poke the browser with a new context (belt-and-suspenders)
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          try {
            var ctx = new AC();
            var buf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
            ctx.resume();
          } catch(e) {}
        }
        audioUnlocked = true;
        hideAudioUI();
        cleanup();
      }

      function cleanup() {
        document.removeEventListener('click',      onUserGesture, true);
        document.removeEventListener('touchstart', onUserGesture, true);
        document.removeEventListener('touchend',   onUserGesture, true);
        document.removeEventListener('keydown',    onUserGesture, true);
      }

      if (!isIframe) {
        document.addEventListener('click',      onUserGesture, true);
        document.addEventListener('touchstart', onUserGesture, true);
        document.addEventListener('touchend',   onUserGesture, true);
        document.addEventListener('keydown',    onUserGesture, true);

        if (!isMobile) {
          window.addEventListener('load', tryDesktopAutoUnlock);
        } else {
          // Show mobile tap hint once loading bar disappears
          setTimeout(function() {
            if (!audioUnlocked) tapOverlay.classList.add('show');
          }, 2000);
        }
      }

      // ── Unity setup ───────────────────────────────────────────────────
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MallangBlast_WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl:      buildUrl + "/MallangBlast_WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/MallangBlast_WebGL.framework.js.unityweb",
        codeUrl:      buildUrl + "/MallangBlast_WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MallangGames",
        productName: "Mallang Blast",
        productVersion: "1.2.0",
        showBanner: unityShowBanner,
      };
      config.autoSyncPersistentDataPath = true;

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function(instance) {
          window.unityInstance = instance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = function() {
            instance.SetFullscreen(1);
          };
          // After Unity loads, try to resume its AudioContext immediately
          // (works on desktop if AudioContext is already unlocked)
          resumeUnityAudioContext();
          // Show mobile tap hint now that loading is done
          if (isMobile && !audioUnlocked && !isIframe) {
            tapOverlay.classList.add('show');
          }
        }).catch(function(message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
