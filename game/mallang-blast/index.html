<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Mallang Blast</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- Back Button: icon only, desktop standalone only -->
    <a href="../../index.html#portfolio" id="back-btn" onclick="if(window.history.length > 1){window.history.back(); return false;}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <!-- Mobile Audio Unlock Overlay -->
    <div id="audio-unlock-overlay">
      <div id="audio-unlock-inner">
        <div id="audio-unlock-icon">🎵</div>
        <div id="audio-unlock-text">탭해서 시작</div>
      </div>
    </div>

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
      }

      #unity-container {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        transform: none !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-canvas {
        max-width: 100% !important;
        max-height: 100% !important;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        display: block !important;
        background: #110e1f;
      }

      #unity-footer {
        display: none !important;
      }

      /* Back button: icon-only circle, desktop only */
      #back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #ffffff;
        text-decoration: none;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        transition: all 0.25s ease;
      }
      #back-btn:hover {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8);
      }

      /* Hide back button on mobile and inside iframe */
      @media (pointer: coarse), (max-width: 768px) {
        #back-btn { display: none !important; }
      }

      /* Mobile Audio Unlock Overlay */
      #audio-unlock-overlay {
        display: none; /* shown via JS only on mobile */
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #audio-unlock-overlay.visible {
        display: flex;
      }
      #audio-unlock-inner {
        text-align: center;
        color: #ffffff;
        pointer-events: none;
        animation: pulseUp 1.6s ease-in-out infinite;
      }
      #audio-unlock-icon {
        font-size: 3.2rem;
        margin-bottom: 14px;
      }
      #audio-unlock-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      @keyframes pulseUp {
        0%, 100% { transform: translateY(0); opacity: 1; }
        50% { transform: translateY(-8px); opacity: 0.75; }
      }
    </style>

    <script>
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var isIframe = window.self !== window.top;

      // Hide back button inside iframe (resume.html embed)
      if (isIframe) {
        document.addEventListener('DOMContentLoaded', function() {
          var btn = document.getElementById('back-btn');
          if (btn) btn.style.display = 'none';
        });
      }

      // Show audio unlock overlay on mobile
      if (isMobile) {
        document.addEventListener('DOMContentLoaded', function() {
          var overlay = document.getElementById('audio-unlock-overlay');
          if (overlay) overlay.classList.add('visible');
        });
      }

      // Unlock AudioContext on first touch (critical for iOS/Android)
      function unlockAudioContext() {
        // Resume any suspended AudioContext
        if (window.AudioContext || window.webkitAudioContext) {
          var AC = window.AudioContext || window.webkitAudioContext;
          // Try to resume all existing AudioContext instances
          if (typeof unityInstance !== 'undefined' && unityInstance) {
            try { unityInstance.Module.resumeAudioContext && unityInstance.Module.resumeAudioContext(); } catch(e) {}
          }
          // Create a silent buffer and play it to unlock
          try {
            var ctx = new AC();
            var buf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
            ctx.resume();
          } catch(e) {}
        }

        // Hide overlay
        var overlay = document.getElementById('audio-unlock-overlay');
        if (overlay) {
          overlay.style.transition = 'opacity 0.3s ease';
          overlay.style.opacity = '0';
          setTimeout(function() { overlay.style.display = 'none'; }, 320);
        }

        // Remove listeners after first touch
        document.removeEventListener('touchstart', unlockAudioContext, true);
        document.removeEventListener('click', unlockAudioContext, true);
      }

      document.addEventListener('touchstart', unlockAudioContext, true);
      document.addEventListener('click', unlockAudioContext, true);
    </script>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=540 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Mallang Blast</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MallangBlast_WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/MallangBlast_WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/MallangBlast_WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/MallangBlast_WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MallangGames",
        productName: "Mallang Blast",
        productVersion: "1.2.0",
        showBanner: unityShowBanner,
      };

      config.autoSyncPersistentDataPath = true;

      if (isMobile) {
        // Mobile: fill entire screen
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // Desktop: full-window responsive or iframe fill
        if (isIframe) {
          var container = document.querySelector("#unity-container");
          container.style.position = "absolute";
          container.style.left = "0";
          container.style.top = "0";
          container.style.width = "100%";
          container.style.height = "100%";
          container.style.transform = "none";
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          var footer = document.querySelector("#unity-footer");
          if (footer) footer.style.display = "none";
        } else {
          canvas.style.width = "960px";
          canvas.style.height = "540px";
        }
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((instance) => {
          window.unityInstance = instance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            instance.SetFullscreen(1);
          };
          // Resume AudioContext after Unity loads (extra safety for mobile)
          if (isMobile) {
            document.addEventListener('touchstart', function resumeAudio() {
              try {
                var ctx = instance.Module && instance.Module.SystemInfo && instance.Module.AL;
                // Force resume via Web Audio API
                if (window.AudioContext || window.webkitAudioContext) {
                  var AC = window.AudioContext || window.webkitAudioContext;
                  var testCtx = new AC();
                  testCtx.resume();
                }
              } catch(e) {}
              document.removeEventListener('touchstart', resumeAudio, true);
            }, { once: true, capture: true });
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
